name: Android Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --version
      - run: ./gradlew test
      - run: ./gradlew assembleDebug
      - name: Package APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DollarLedger.apk
          cd dist
          sha256sum DollarLedger.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DollarLedger-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
