name: Android Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --version
      - run: ./gradlew test
      - run: ./gradlew assembleDebug
      - name: Package APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DollarLedger.apk
          cd dist
          sha256sum DollarLedger.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DollarLedger-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Read app version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/DollarLedger.apk#DollarLedger-v${APP_VERSION}.apk \
              dist/SHA256SUMS.txt#SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              dist/DollarLedger.apk#DollarLedger-v${APP_VERSION}.apk \
              dist/SHA256SUMS.txt#SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Dollar Ledger v${APP_VERSION}" \
              --notes "Dollar Ledger v${APP_VERSION}: navy Transactions header, centered Wallet balance with dotted world map, and account-to-account transfer support."
          fi
